# cluster-nfs-server.conf - a cluster node that also EXPORTS the NFS share the cluster mounts, with a ZFS data pool.
# the name `hostname -s` prints
NAME=pve2
NVIDIA=no
NICS="eno1"
CLUSTER=yes
# the mount point of the cluster's NFS storage: /mnt/pve/<storage name>; recheck probes it and checks that storage in pvesm
SHARED=/mnt/pve/backups
# this node exports the share: precheck records the exports and to-8.4, upgrade and reboot STOP until --nfs-quiet
NFS_SERVER=yes
# a data pool (not the root pool): health, scrub, cachefile and ARC settings are checked and compared after the reboot
ZFS_POOL=tank
# guests that must be DOWN for the window (the script never starts, stops or migrates a guest)
STAY="100 101"
CEPH=no
# processes that block every host-changing phase (pgrep -f patterns), and what to run to stop them
#GUARD_PROCS="myworker"
#HOLD_HINT="run ./hold-workers.sh on the admin box"
# units that must be active (or have an active timer) after the reboot, and files that must exist
#UNITS="my-watchdog"
#FILES="/usr/local/sbin/my-agent"
