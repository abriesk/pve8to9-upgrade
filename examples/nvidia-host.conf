# nvidia-host.conf - a cluster node with two NVIDIA cards; the driver phase installs the .run named in driver.conf.
# the name `hostname -s` prints
NAME=gpu1
NVIDIA=yes
# cards `nvidia-smi -L` lists; recheck wants at least this many, each with persistence mode on (0 = no card, module checks only)
GPUS=2
NICS="enp0s25"
CLUSTER=yes
SHARED=""
NFS_SERVER=no
CEPH=no
# the .run installer may be named here instead of in driver.conf (the profile wins):
#NV_RUN=NVIDIA-Linux-x86_64-580.178.04.run
#NV_SHA256=<sha256 of that file, from NVIDIA's .run.sha256sum>
# accept removals the trixie dist-upgrade simulation shows and you have reviewed (not t64 renames)
#REMOVE_OK="pkg-a pkg-b"
