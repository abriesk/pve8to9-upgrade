# single-node.conf - a standalone Proxmox node (no cluster, no shared storage, no GPU). Copy to hosts/<host>.conf.
# the name `hostname -s` prints; the guards refuse to run on any other host
NAME=pve1
# no NVIDIA card or driver on this host
NVIDIA=no
# physical NICs whose offloads recheck verifies stay off; "" = none checked
NICS=""
# not a cluster member: skips the quorum checks
CLUSTER=no
# no NFS storage on this node
SHARED=""
NFS_SERVER=no
# CEPH=no excuses pve8to9's three Ceph-status FAILs (only valid where no Ceph daemon, data or storage exists)
CEPH=no
